{
  "services": {
    "semgrep": {
      "image": null,
      "platform": null,
      "pull_policy": "never",
      "network_mode": "none",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "user": null,
      "working_dir": "/src",
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=256m"
      ],
      "environment": {
        "HOME": "/tmp",
        "SEMGREP_SEND_METRICS": "off",
        "SEMGREP_ENABLE_VERSION_CHECK": "0",
        "SEMGREP_IN_DOCKER": "1",
        "SEMGREP_USER_AGENT_APPEND": "Docker",
        "PYTHONIOENCODING": "utf8",
        "DOCKER_OTEL_RESOURCE_ATTRIBUTES": "",
        "DD_SERVICE": "",
        "TSAN_OPTIONS": ""
      },
      "volumes": [],
      "entrypoint": [
        "semgrep"
      ],
      "command": [
        "scan",
        "--oss-only",
        "--disable-nosem",
        "--config",
        "/rules",
        "--metrics",
        "off",
        "--disable-version-check",
        "--no-git-ignore",
        "--json",
        "--output",
        "/reports/semgrep.json",
        "/src"
      ],
      "cpus": 2,
      "mem_limit": "2g",
      "memswap_limit": "2g",
      "pids_limit": 128
    },
    "trivy": {
      "image": null,
      "platform": null,
      "pull_policy": "never",
      "network_mode": "none",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "user": null,
      "working_dir": "/src",
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=256m"
      ],
      "environment": {
        "HOME": "/tmp",
        "TRIVY_DISABLE_TELEMETRY": "true"
      },
      "volumes": [],
      "entrypoint": [
        "trivy"
      ],
      "command": [
        "fs",
        "--scanners",
        "vuln",
        "--pkg-types",
        "library",
        "--include-dev-deps",
        "--list-all-pkgs",
        "--skip-db-update",
        "--skip-java-db-update",
        "--offline-scan",
        "--disable-telemetry",
        "--cache-dir",
        "/cache",
        "--cache-backend",
        "memory",
        "--format",
        "json",
        "--output",
        "/reports/trivy.json",
        "--exit-code",
        "0",
        "/src"
      ],
      "cpus": 2,
      "mem_limit": "2g",
      "memswap_limit": "2g",
      "pids_limit": 128
    }
  }
}
